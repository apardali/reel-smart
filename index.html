<div class="wrap">
 <header class="marquee"><div class="bulbs" id="bulbs"></div>
  <h1>Reel Smart</h1><p>Movie &amp; TV trivia night</p></header>

 <section class="stage" id="setup">
  <div id="setupBanner"></div>
  <div class="joinbar"><div><strong>Playing on your phone?</strong><div style="font-size:14px;opacity:.85">Join the game on the TV with its room code.</div></div><button id="toJoin">Join a game</button></div>
  <h2>Set up a game</h2>
  <div class="modes" id="modePick">
   <button type="button" class="mode" data-v="host" aria-pressed="true">TV + phones<small>This screen is the TV. Everyone answers on their phone.</small></button>
   <button type="button" class="mode" data-v="local" aria-pressed="false">One screen<small>Take turns on this device. No phones needed.</small></button>
  </div>
  <div id="localPlayers" class="hide">
   <label for="pname">Players</label>
   <form id="addForm" class="row">
    <input type="text" id="pname" placeholder="Player or team name" maxlength="18" autocomplete="off">
    <button type="submit">Add</button>
   </form>
   <div class="chips" id="chips"></div>
  </div>
  <label>Category</label>
  <div class="row" id="catPick">
   <button type="button" class="pill" data-v="all" aria-pressed="false">Everything</button>
   <button type="button" class="pill" data-v="mix" aria-pressed="true">Movies + TV</button>
   <button type="button" class="pill" data-v="movie" aria-pressed="false">Movies only</button>
   <button type="button" class="pill" data-v="tv" aria-pressed="false">TV only</button>
   <button type="button" class="pill" data-v="clips" aria-pressed="false">Name that scene</button>
   <button type="button" class="pill" data-v="hard" aria-pressed="false">Clip challenge (hard)</button>
  </div>
  <label id="lenLabel">Questions</label>
  <div class="row" id="lenPick">
   <button type="button" class="pill" data-v="3" aria-pressed="false">3</button>
   <button type="button" class="pill" data-v="5" aria-pressed="true">5</button>
   <button type="button" class="pill" data-v="8" aria-pressed="false">8</button>
   <button type="button" class="pill" data-v="10" aria-pressed="false">10</button>
   <button type="button" class="pill" data-v="12" aria-pressed="false">12</button>
  </div>
  <button class="start" id="startBtn">Open the lobby</button>
  <p class="status warn hide" id="setupWarn"></p>
  <p class="status" id="clipCount" style="margin-top:12px">Loading clips…</p>
  <p class="note" id="modeNote"></p>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><a class="ghost exit btnlink" href="admin.html">Admin</a></div>
 </section>

 <section class="stage hide" id="lobby">
  <div class="meta"><span>Lobby</span><button class="ghost exit" id="lobbyExit">Exit</button></div>
  <div class="codebox"><div class="note" style="margin:0 0 4px">Room code</div><div class="code" id="roomCode">----</div>
   <p class="howto">On your phone, go to <b id="siteUrl"></b>, tap <b>Join a game</b> and enter this code.</p></div>
  <div class="lobbylist" id="lobbyList"></div>
  <p class="status" id="lobbyNote" style="text-align:center">Waiting for players…</p>
  <button class="start" id="hostGo" disabled>Start the game</button>
 </section>

 <section class="stage hide" id="join">
  <div class="meta"><span>Join a game</span><button class="ghost exit" id="joinBack">Back</button></div>
  <h2>Join the game on the TV</h2>
  <form id="joinForm">
   <label for="jname">Your name</label>
   <input type="text" id="jname" maxlength="18" autocomplete="nickname" placeholder="Name or team" required style="width:100%">
   <label for="jcode">Room code</label>
   <input type="text" id="jcode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" required style="width:100%;text-transform:uppercase;letter-spacing:.3em;font-weight:800">
   <button class="start" type="submit" id="joinBtn">Join</button>
  </form>
  <p class="status warn hide" id="joinWarn"></p>
 </section>

 <section class="stage hide" id="phone">
  <div class="meta"><span id="phCode"></span><button class="ghost exit" id="phLeave">Leave</button></div>
  <div class="me"><span id="phName"></span><span id="phScore">0 pts</span></div>
  <div id="phBody"></div>
 </section>

 <section class="stage hide" id="play">
  <div class="meta"><span id="qnum"></span><span class="row" style="gap:12px"><span id="pts"></span><button class="ghost exit" id="exitBtn">Exit</button></span></div>
  <div class="pgrid">
   <div>
    <div class="turn" id="turn"></div>
    <span class="cat" id="cat"></span>
    <div class="q" id="qtext"></div>
    <div class="emoji hide" id="emoji"></div>
    <div class="screen hide" id="screen"><video id="vid" playsinline controls preload="auto"></video></div>
   </div>
   <div>
    <button class="hide" id="revealBtn">Show the answers</button>
    <div id="answerArea">
     <div class="timer"><div id="bar"></div></div>
     <div class="opts" id="opts"></div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
    <button class="next hide" id="nextBtn">Next question</button>
   </div>
  </div>
 </section>

 <section class="stage hide" id="end">
  <h2 id="winner"></h2>
  <ol class="podium" id="podium"></ol>
  <div class="row"><button id="againBtn">Play again</button><button class="ghost" id="newBtn">Change setup</button></div>
 </section>

 <div class="board" id="board"></div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
