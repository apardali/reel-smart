<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Smart · Movie &amp; TV Trivia</title>
<meta name="description" content="Reel Smart: a movie and TV party trivia game. Play on the TV, answer on your phone.">
<meta name="theme-color" content="#070d24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142233'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f2c14e' font-family='Georgia'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Russo+One&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <radialGradient id="sky" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#1b3a8f"/><stop offset=".55" stop-color="#0a1645"/><stop offset="1" stop-color="#040820"/></radialGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe2ff" stop-opacity=".75"/><stop offset="1" stop-color="#cfe2ff" stop-opacity="0"/></linearGradient>
 <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d0610"/><stop offset=".6" stop-color="#a3101f"/><stop offset="1" stop-color="#6f0712"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b3"/><stop offset=".45" stop-color="#e0a93a"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd36b" stop-opacity=".55"/><stop offset="1" stop-color="#ffd36b" stop-opacity="0"/></radialGradient>
 <pattern id="holes" width="22" height="14" patternUnits="userSpaceOnUse"><rect x="5" y="3" width="11" height="8" rx="2" fill="#120b02"/></pattern>
</defs>
<rect width="1440" height="900" fill="url(#sky)"/>
<g class="beams">
 <polygon class="b1" points="70,0 120,0 520,900 220,900" fill="url(#beam)" opacity=".35"/>
 <polygon class="b2" points="1320,0 1370,0 1220,900 920,900" fill="url(#beam)" opacity=".35"/>
 <polygon class="b3" points="380,0 410,0 640,900 470,900" fill="url(#beam)" opacity=".18"/>
 <polygon class="b4" points="1030,0 1060,0 970,900 800,900" fill="url(#beam)" opacity=".18"/>
</g>
<g fill="#fff" opacity=".8">
 <circle cx="95" cy="40" r="16" fill="#e8f1ff" opacity=".9"/><circle cx="1345" cy="40" r="16" fill="#e8f1ff" opacity=".9"/>
 <circle cx="230" cy="130" r="1.6"/><circle cx="520" cy="70" r="1.2"/><circle cx="760" cy="150" r="1.5"/><circle cx="980" cy="60" r="1.1"/><circle cx="1180" cy="170" r="1.6"/><circle cx="340" cy="260" r="1"/><circle cx="1260" cy="300" r="1.1"/><circle cx="640" cy="40" r="1.3"/>
</g>
<path d="M560 600 L880 600 L1160 900 L280 900Z" fill="url(#carpet)"/>
<path d="M560 600 L880 600 L1160 900 L280 900Z" fill="#000" opacity=".15"/>
<ellipse cx="720" cy="610" rx="420" ry="40" fill="url(#glow)" opacity=".5"/>
<g>
 <path d="M150 640 Q 230 700 310 640" stroke="#8d0b19" stroke-width="10" fill="none"/>
 <path d="M1130 640 Q 1210 700 1290 640" stroke="#8d0b19" stroke-width="10" fill="none"/>
 <g fill="url(#gold)"><rect x="142" y="630" width="12" height="190" rx="5"/><circle cx="148" cy="624" r="12"/><ellipse cx="148" cy="822" rx="30" ry="9"/>
  <rect x="302" y="630" width="12" height="190" rx="5"/><circle cx="308" cy="624" r="12"/><ellipse cx="308" cy="822" rx="30" ry="9"/>
  <rect x="1122" y="630" width="12" height="190" rx="5"/><circle cx="1128" cy="624" r="12"/><ellipse cx="1128" cy="822" rx="30" ry="9"/>
  <rect x="1282" y="630" width="12" height="190" rx="5"/><circle cx="1288" cy="624" r="12"/><ellipse cx="1288" cy="822" rx="30" ry="9"/></g>
</g>
<g transform="translate(-40 760) rotate(-18)"><rect width="420" height="62" fill="url(#gold)"/><rect width="420" height="14" fill="url(#holes)"/><rect y="48" width="420" height="14" fill="url(#holes)"/><g fill="#2a1a06" opacity=".55"><rect x="12" y="17" width="56" height="28"/><rect x="80" y="17" width="56" height="28"/><rect x="148" y="17" width="56" height="28"/><rect x="216" y="17" width="56" height="28"/><rect x="284" y="17" width="56" height="28"/><rect x="352" y="17" width="56" height="28"/></g></g>
<g transform="translate(1080 900) rotate(-24)"><rect width="460" height="62" fill="url(#gold)"/><rect width="460" height="14" fill="url(#holes)"/><rect y="48" width="460" height="14" fill="url(#holes)"/><g fill="#2a1a06" opacity=".55"><rect x="12" y="17" width="56" height="28"/><rect x="80" y="17" width="56" height="28"/><rect x="148" y="17" width="56" height="28"/><rect x="216" y="17" width="56" height="28"/><rect x="284" y="17" width="56" height="28"/><rect x="352" y="17" width="56" height="28"/></g></g>
</svg></div>
<div class="wrap">
 <header class="marquee"><div class="bulbs" id="bulbs"></div>
  <svg class="lg-reelart" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset=".5" stop-color="#9aa3b5"/><stop offset="1" stop-color="#4b5263"/></linearGradient></defs><circle cx="50" cy="50" r="46" fill="url(#silver)"/><circle cx="50" cy="50" r="40" fill="#2b3140"/><g fill="url(#silver)"><circle cx="50" cy="26" r="11"/><circle cx="50" cy="74" r="11"/><circle cx="29" cy="38" r="11"/><circle cx="71" cy="38" r="11"/><circle cx="29" cy="62" r="11"/><circle cx="71" cy="62" r="11"/><circle cx="50" cy="50" r="7"/></g><g fill="#2b3140"><circle cx="50" cy="26" r="7"/><circle cx="50" cy="74" r="7"/><circle cx="29" cy="38" r="7"/><circle cx="71" cy="38" r="7"/><circle cx="29" cy="62" r="7"/><circle cx="71" cy="62" r="7"/></g><circle cx="50" cy="50" r="3" fill="#2b3140"/></svg>
  <svg class="lg-clap" viewBox="0 0 120 80" aria-hidden="true"><g transform="rotate(-10 10 30)"><rect x="6" y="14" width="110" height="18" rx="2" fill="#f4f4f4"/><g fill="#15161a"><polygon points="18,14 34,14 24,32 8,32"/><polygon points="46,14 62,14 52,32 36,32"/><polygon points="74,14 90,14 80,32 64,32"/><polygon points="102,14 116,14 108,32 92,32"/></g></g><rect x="6" y="34" width="110" height="44" rx="3" fill="#15161a"/><rect x="6" y="34" width="110" height="12" fill="#f4f4f4"/><g fill="#15161a"><polygon points="16,34 30,34 24,46 10,46"/><polygon points="44,34 58,34 52,46 38,46"/><polygon points="72,34 86,34 80,46 66,46"/><polygon points="100,34 114,34 108,46 94,46"/></g></svg>
  <h1 class="logo" aria-label="Reel Smart"><span class="lg-reel">Reel</span><span class="lg-star" aria-hidden="true">★</span><span class="lg-smart">SMART</span></h1>
  <p>Movie &amp; TV trivia night</p></header>

 <section class="stage" id="setup">
  <div class="joinbar"><div><strong>Playing on your phone?</strong><div style="font-size:14px;opacity:.85">Join the game on the TV with its room code.</div></div><button id="toJoin">Join a game</button></div>
  <h2>Set up a game</h2>
  <div class="modes" id="modePick">
   <button type="button" class="mode" data-v="host" aria-pressed="true">TV + phones<small>This screen is the TV. Everyone answers on their phone.</small></button>
   <button type="button" class="mode" data-v="local" aria-pressed="false">One screen<small>Take turns on this device. No phones needed.</small></button>
  </div>
  <div id="localPlayers" class="hide">
   <label for="pname">Players</label>
   <form id="addForm" class="row">
    <input type="text" id="pname" placeholder="Player or team name" maxlength="18" autocomplete="off">
    <button type="submit">Add</button>
   </form>
   <div class="chips" id="chips"></div>
  </div>
  <label>Category</label>
  <div class="row" id="catPick">
   <button type="button" class="pill" data-v="all" aria-pressed="false">Everything</button>
   <button type="button" class="pill" data-v="mix" aria-pressed="true">Movies + TV</button>
   <button type="button" class="pill" data-v="movie" aria-pressed="false">Movies only</button>
   <button type="button" class="pill" data-v="tv" aria-pressed="false">TV only</button>
   <button type="button" class="pill" data-v="clips" aria-pressed="false">Name that scene</button>
   <button type="button" class="pill" data-v="hard" aria-pressed="false">Clip challenge (hard)</button>
  </div>
  <label id="lenLabel">Questions</label>
  <div class="row" id="lenPick">
   <button type="button" class="pill" data-v="10" aria-pressed="true">10</button>
   <button type="button" class="pill" data-v="20" aria-pressed="false">20</button>
   <button type="button" class="pill" data-v="30" aria-pressed="false">30</button>
  </div>
  <button class="start" id="startBtn">Open the lobby</button>
  <p class="status warn hide" id="setupWarn"></p>
  <p class="status" id="clipCount" style="margin-top:12px">Loading clips…</p>
  <p class="note" id="modeNote"></p>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><a class="ghost exit btnlink" href="admin.html">Admin</a></div>
 </section>

 <section class="stage hide" id="lobby">
  <div class="meta"><span>Lobby</span><button class="ghost exit" id="lobbyExit">Exit</button></div>
  <div class="codebox"><div class="note" style="margin:0 0 4px">Room code</div><div class="code" id="roomCode">----</div>
   <p class="howto">On your phone, go to <b id="siteUrl"></b>, tap <b>Join a game</b> and enter this code.</p></div>
  <div class="lobbylist" id="lobbyList"></div>
  <p class="status" id="lobbyNote" style="text-align:center">Waiting for players…</p>
  <button class="start" id="hostGo" disabled>Start the game</button>
 </section>

 <section class="stage hide" id="join">
  <div class="meta"><span>Join a game</span><button class="ghost exit" id="joinBack">Back</button></div>
  <h2>Join the game on the TV</h2>
  <form id="joinForm">
   <label for="jname">Your name</label>
   <input type="text" id="jname" maxlength="18" autocomplete="nickname" placeholder="Name or team" required style="width:100%">
   <label for="jcode">Room code</label>
   <input type="text" id="jcode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" required style="width:100%;text-transform:uppercase;letter-spacing:.3em;font-weight:800">
   <button class="start" type="submit" id="joinBtn">Join</button>
  </form>
  <p class="status warn hide" id="joinWarn"></p>
 </section>

 <section class="stage hide" id="phone">
  <div class="meta"><span id="phCode"></span><button class="ghost exit" id="phLeave">Leave</button></div>
  <div class="me"><span id="phName"></span><span id="phScore">0 pts</span></div>
  <div id="phBody"></div>
 </section>

 <section class="stage hide" id="play">
  <div class="meta"><span id="qnum"></span><span class="row" style="gap:12px"><span id="pts"></span><button class="ghost exit" id="exitBtn">Exit</button></span></div>
  <div class="pgrid">
   <div>
    <div class="turn" id="turn"></div>
    <span class="cat" id="cat"></span>
    <div class="q" id="qtext"></div>
    <div class="emoji hide" id="emoji"></div>
    <div class="screen hide" id="screen"><video id="vid" playsinline controls preload="auto"></video></div>
   </div>
   <div>
    <button class="hide" id="revealBtn">Show the answers</button>
    <div id="answerArea">
     <div class="timer"><div id="bar"></div></div>
     <div class="opts" id="opts"></div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
    <button class="next hide" id="nextBtn">Next question</button>
   </div>
  </div>
 </section>

 <section class="stage hide" id="end">
  <h2 id="winner"></h2>
  <ol class="podium" id="podium"></ol>
  <div class="row"><button id="againBtn">Play again</button><button class="ghost" id="newBtn">Change setup</button></div>
 </section>

 <div class="board" id="board"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
