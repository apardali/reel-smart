<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <radialGradient id="sky" cx="50%" cy="18%" r="85%">
  <stop offset="0" stop-color="#2a56c4"/><stop offset=".28" stop-color="#173a96"/><stop offset=".6" stop-color="#0b1c5a"/><stop offset="1" stop-color="#050b28"/>
 </radialGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e4efff" stop-opacity=".95"/><stop offset=".55" stop-color="#9cc0ff" stop-opacity=".35"/><stop offset="1" stop-color="#6f9cff" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#e8f2ff" stop-opacity=".95"/><stop offset="1" stop-color="#8fb6ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4a0614"/><stop offset=".35" stop-color="#8e0c22"/><stop offset=".75" stop-color="#c0142e"/><stop offset="1" stop-color="#7a0818"/>
 </linearGradient>
 <linearGradient id="carpetShade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".22" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#ff6b7d" stop-opacity=".12"/><stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
 </linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b55"/><stop offset="1" stop-color="#050a24"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7a4a0c"/><stop offset=".3" stop-color="#ffd978"/><stop offset=".5" stop-color="#fff3c4"/><stop offset=".7" stop-color="#e3a63a"/><stop offset="1" stop-color="#6b3f08"/>
 </linearGradient>
 <radialGradient id="ball" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff6d0"/><stop offset=".4" stop-color="#f2be4e"/><stop offset="1" stop-color="#6b3f08"/></radialGradient>
 <linearGradient id="rope" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5468"/><stop offset=".5" stop-color="#b10f27"/><stop offset="1" stop-color="#5c0512"/></linearGradient>
 <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5a3406"/><stop offset=".2" stop-color="#f6c45a"/><stop offset=".45" stop-color="#fff0b8"/><stop offset=".7" stop-color="#d9962c"/><stop offset="1" stop-color="#4a2a05"/>
 </linearGradient>
 <radialGradient id="glowGold" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd36b" stop-opacity=".7"/><stop offset="1" stop-color="#ffb43a" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7fb2ff" stop-opacity=".55"/><stop offset="1" stop-color="#3d6dff" stop-opacity="0"/></radialGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
 <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
 <g id="post">
  <ellipse cx="0" cy="0" rx="34" ry="10" fill="#3a2205" opacity=".5"/>
  <ellipse cx="0" cy="-4" rx="30" ry="9" fill="url(#gold)"/>
  <rect x="-7" y="-200" width="14" height="196" rx="6" fill="url(#gold)"/>
  <rect x="-11" y="-206" width="22" height="10" rx="4" fill="url(#gold)"/>
  <circle cx="0" cy="-222" r="17" fill="url(#ball)"/>
 </g>
 <g id="strip">
  <path d="M0 0 H900" stroke="url(#film)" stroke-width="86" fill="none"/>
  <path d="M0 -30 H900" stroke="#140a01" stroke-width="12" stroke-dasharray="14 12" fill="none"/>
  <path d="M0 30 H900" stroke="#140a01" stroke-width="12" stroke-dasharray="14 12" fill="none"/>
  <g fill="#2a1604" opacity=".55"><rect x="10" y="-20" width="70" height="40"/><rect x="95" y="-20" width="70" height="40"/><rect x="180" y="-20" width="70" height="40"/><rect x="265" y="-20" width="70" height="40"/><rect x="350" y="-20" width="70" height="40"/><rect x="435" y="-20" width="70" height="40"/><rect x="520" y="-20" width="70" height="40"/><rect x="605" y="-20" width="70" height="40"/><rect x="690" y="-20" width="70" height="40"/><rect x="775" y="-20" width="70" height="40"/></g>
 </g>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>
<!-- far city haze / horizon glow -->
<ellipse cx="960" cy="610" rx="1100" ry="140" fill="url(#glowBlue)" filter="url(#softer)"/>

<!-- spotlight beams -->
<g filter="url(#soft)" style="mix-blend-mode:screen">
 <polygon points="140,40 200,40 860,1080 420,1080" fill="url(#beam)" opacity=".55"/>
 <polygon points="1720,40 1780,40 1500,1080 1060,1080" fill="url(#beam)" opacity=".55"/>
 <polygon points="470,10 510,10 860,800 620,800" fill="url(#beam)" opacity=".35"/>
 <polygon points="1410,10 1450,10 1300,800 1060,800" fill="url(#beam)" opacity=".35"/>
 <polygon points="40,160 80,140 700,700 520,760" fill="url(#beam)" opacity=".28"/>
 <polygon points="1880,160 1840,140 1220,700 1400,760" fill="url(#beam)" opacity=".28"/>
</g>
<!-- lamps -->
<g>
 <circle cx="170" cy="46" r="70" fill="url(#lamp)" opacity=".9"/><circle cx="170" cy="46" r="22" fill="#fff"/>
 <circle cx="1750" cy="46" r="70" fill="url(#lamp)" opacity=".9"/><circle cx="1750" cy="46" r="22" fill="#fff"/>
 <circle cx="490" cy="14" r="44" fill="url(#lamp)" opacity=".8"/><circle cx="490" cy="14" r="12" fill="#fff"/>
 <circle cx="1430" cy="14" r="44" fill="url(#lamp)" opacity=".8"/><circle cx="1430" cy="14" r="12" fill="#fff"/>
</g>
<!-- stars -->
<g fill="#fff">
 <circle cx="320" cy="120" r="2.2"/><circle cx="640" cy="90" r="1.6"/><circle cx="760" cy="200" r="1.4"/><circle cx="1160" cy="150" r="1.8"/><circle cx="1280" cy="80" r="1.4"/><circle cx="1600" cy="210" r="2"/><circle cx="260" cy="300" r="1.3"/><circle cx="1680" cy="330" r="1.5"/><circle cx="880" cy="60" r="1.2"/><circle cx="1040" cy="260" r="1.3"/><circle cx="420" cy="420" r="1.4"/><circle cx="1500" cy="440" r="1.2"/>
 <path d="M330 230 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" opacity=".9"/><path d="M1590 120 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" opacity=".9"/><path d="M1120 330 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".8"/><path d="M700 330 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".8"/>
</g>

<!-- floor -->
<path d="M0 620 H1920 V1080 H0Z" fill="url(#floor)"/>
<!-- red carpet in perspective -->
<path d="M800 600 L1120 600 L1560 1080 L360 1080Z" fill="url(#carpet)"/>
<path d="M800 600 L1120 600 L1560 1080 L360 1080Z" fill="url(#carpetShade)"/>
<path d="M800 600 L1120 600" stroke="#ff8a99" stroke-opacity=".35" stroke-width="3"/>
<ellipse cx="960" cy="610" rx="420" ry="36" fill="url(#glowGold)" opacity=".55" filter="url(#soft)"/>

<!-- stanchions + velvet ropes (left) -->
<g>
 <g transform="translate(250 1010) scale(1.15)"><use href="#post"/></g>
 <g transform="translate(470 870) scale(.9)"><use href="#post"/></g>
 <g transform="translate(640 760) scale(.7)"><use href="#post"/></g>
 <path d="M262 760 Q 380 880 470 680" stroke="url(#rope)" stroke-width="16" fill="none" stroke-linecap="round"/>
 <path d="M470 680 Q 570 770 640 612" stroke="url(#rope)" stroke-width="12" fill="none" stroke-linecap="round"/>
</g>
<!-- stanchions + velvet ropes (right) -->
<g>
 <g transform="translate(1670 1010) scale(1.15)"><use href="#post"/></g>
 <g transform="translate(1450 870) scale(.9)"><use href="#post"/></g>
 <g transform="translate(1280 760) scale(.7)"><use href="#post"/></g>
 <path d="M1658 760 Q 1540 880 1450 680" stroke="url(#rope)" stroke-width="16" fill="none" stroke-linecap="round"/>
 <path d="M1450 680 Q 1350 770 1280 612" stroke="url(#rope)" stroke-width="12" fill="none" stroke-linecap="round"/>
</g>

<!-- golden bokeh -->
<g filter="url(#tiny)" fill="#ffd36b">
 <circle cx="120" cy="760" r="6" opacity=".6"/><circle cx="1800" cy="780" r="7" opacity=".6"/><circle cx="560" cy="980" r="5" opacity=".5"/><circle cx="1380" cy="990" r="5" opacity=".5"/><circle cx="90" cy="560" r="4" opacity=".5"/><circle cx="1840" cy="560" r="4" opacity=".5"/>
</g>
<ellipse cx="120" cy="980" rx="260" ry="120" fill="url(#glowGold)" opacity=".45" filter="url(#softer)"/>
<ellipse cx="1800" cy="980" rx="260" ry="120" fill="url(#glowGold)" opacity=".45" filter="url(#softer)"/>

<!-- curling gold film strips in the bottom corners -->
<g transform="translate(-120 1020) rotate(-26)"><use href="#strip"/></g>
<g transform="translate(-40 1110) rotate(-8) scale(.8)"><use href="#strip"/></g>
<g transform="translate(2040 1020) rotate(206) scale(1 -1)"><use href="#strip"/></g>
<g transform="translate(1960 1110) rotate(188) scale(.8 -.8)"><use href="#strip"/></g>
</svg>
